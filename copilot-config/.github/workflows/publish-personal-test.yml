# ============================================================
# CI + Publish — TESTE MANUAL NEXUS (copilot-config)
# ============================================================
# ⚠️  Este workflow é TEMPORÁRIO para validação manual.
#     NÃO fazer merge no main. Usar no branch test/nexus-publish.
#     Apagar depois que o teste for concluído.
#
# Diferenças em relação ao publish.yml enterprise:
#   - Branch dedicada para teste manual
#   - Mesmo registry Nexus usado no DS aprovado
#
# Pré-requisitos:
#   1. Adicionar secret NEXUS_TOKEN no repo
#   2. Garantir package.json publishConfig.registry -> https://nexus.tools.dock.tech/repository/npm-internal/
# ============================================================

name: CI + Publish (Nexus Test — copilot-config)

on:
  push:
    branches: [test/nexus-publish]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Testes de sanidade (copilot-config é só arquivos de config)
  # ─────────────────────────────────────────────
  test:
    name: Lint e validação de estrutura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar estrutura de skills e instructions
        run: |
          echo "Verificando estrutura do copilot-config..."

          # Verificar que os diretórios obrigatórios existem
          dirs=(
            "base/instructions"
            "base/prompts"
            "base/agents"
            "base/skills"
            "templates/project-init"
            "templates/landing-page"
            "scripts"
          )

          for dir in "${dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir"
            else
              echo "❌ $dir — FALTANDO"
              exit 1
            fi
          done

          # Verificar que init.mjs existe e é válido JavaScript
          node --check scripts/init.mjs && echo "✅ scripts/init.mjs — JS válido"

          # Contar skills e instructions
          SKILLS=$(ls base/skills/ | wc -l)
          INSTRUCTIONS=$(ls base/instructions/ | wc -l)
          PROMPTS=$(ls base/prompts/ | wc -l)
          echo ""
          echo "📊 Inventário:"
          echo "   Skills:       $SKILLS"
          echo "   Instructions: $INSTRUCTIONS"
          echo "   Prompts:      $PROMPTS"

  # ─────────────────────────────────────────────
  # JOB 2: Security scan
  # ─────────────────────────────────────────────
  security:
    name: Segurança (audit + secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Gitleaks — detecção de segredos
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c3  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3: Publicar no Nexus
  # ─────────────────────────────────────────────
  publish:
    name: Publicar (Nexus manual test)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: |
      (github.ref == 'refs/heads/test/nexus-publish' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node 22 + Nexus
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://nexus.tools.dock.tech/repository/npm-internal/
          scope: "@dock-tech"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar configuração de publish
        run: |
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          PKG_REGISTRY=$(node -e "console.log(require('./package.json').publishConfig?.registry || '')")
          echo "Package name: $PKG_NAME"
          echo "Registry: $PKG_REGISTRY"
          if [[ "$PKG_NAME" != "@dock-tech/"* ]]; then
            echo "❌ ERRO: Mude package.json name para @dock-tech/shared-copilot-front-lib"
            exit 1
          fi
          if [[ "$PKG_REGISTRY" != "https://nexus.tools.dock.tech/repository/npm-internal/"* ]]; then
            echo "❌ ERRO: Mude publishConfig.registry para https://nexus.tools.dock.tech/repository/npm-internal/"
            exit 1
          fi
          echo "✅ Configuração OK"

      - name: Publicar no Nexus
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      - name: Testar o init após publicação
        run: |
          # Criar diretório temporário e testar o init
          mkdir -p /tmp/test-init && cd /tmp/test-init
          npm init -y
          echo "registry=https://nexus.tools.dock.tech/repository/npm-all/" > .npmrc
          echo "//nexus.tools.dock.tech/repository/npm-internal/:_authToken=$NODE_AUTH_TOKEN" >> .npmrc
          npm install @dock-tech/shared-copilot-front-lib
          node node_modules/@dock-tech/shared-copilot-front-lib/scripts/init.mjs --template project-init
          echo "✅ npx @dock-tech/shared-copilot-front-lib init funcionou"
          ls -la .github/ || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      - name: Resumo do publish
        run: |
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "## ✅ @dock-tech/shared-copilot-front-lib publicado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`${PKG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Versão | \`${PKG_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Uso | \`npx ${PKG_NAME} init\` |" >> $GITHUB_STEP_SUMMARY
