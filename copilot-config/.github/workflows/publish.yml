# ============================================================
# CI + Publish — @dock-tech/shared-copilot-front-lib
# ============================================================
# Gatilhos:
#   - PR        → testes + validação de integridade das instructions
#   - Push main → tudo acima + publish no Nexus
#
# Nota: Everlast Pipeline (Jenkins) é a via primária de publicação.
#       Este workflow serve para repos que ainda não têm Everlast
#       conectado ou para validação em pull requests.
# ============================================================

name: CI + Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # JOB 1: Testes + validação das instructions
  # ───────────────────────────────────────────────
  test:
    name: Testes e validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar instructions (integridade)
        run: node tests/instruction-tests.mjs

      - name: Validar prompts e evals
        run: node tests/prompt-evals.mjs
        continue-on-error: true # evals dependem de contexto externo

  # ───────────────────────────────────────────────
  # JOB 2: Security scan
  # ───────────────────────────────────────────────
  security:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detecção de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=high

  # ───────────────────────────────────────────────
  # JOB 3: Publicar no Nexus (só em main)
  # ───────────────────────────────────────────────
  publish:
    name: Publicar no Nexus
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 + Nexus
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://nexus.tools.dock.tech/repository/npm-internal/
          scope: "@dock-tech"

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Publicar
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_TOKEN }}
